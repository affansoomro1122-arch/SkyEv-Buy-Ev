<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product | SKY Electric Trucks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="/STYLE1.CSS">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>.d-note{font-size:12px;color:var(--mut);margin:-8px 0 16px}.book{display:flex;align-items:baseline;gap:12px;border:1px solid var(--teal);background:#0c0c0d;padding:10px 16px;margin-bottom:22px;border-radius:6px;width:fit-content}.book span{font-size:12px;color:var(--mut)}.book b{font-weight:600;font-size:15px}</style>
</head>
<body>
<div id="site-header"></div>

<main class="page">
 <div class="wrap" id="view"></div>
</main>

<div id="site-footer"></div>

<script src="app.js"></script>
<script>
(function () {
  var E = SKY.esc, view = document.getElementById('view');
  SKY.load().then(function (all) {
  var id = new URLSearchParams(location.search).get('id');
  var p = all.filter(function (x) { return x.id === id; })[0];

  if (!p) {
    view.innerHTML = '<div class="empty"><h2>Product not found</h2><p style="margin:12px 0 24px">This product may have been removed.</p><a class="btn" href="products.html">Back to Products</a></div>';
    document.title = 'Product not found | SKY Electric Trucks';
    return;
  }
  document.title = p.name + ' | SKY Electric Trucks';

  var imgs = (p.images && p.images.length) ? p.images : [''];
  // Gallery items: the product video (if any) is always first = the main item
  var media = [];
  if (p.video && SKY.videoInfo(p.video)) media.push({ t: 'v', src: p.video });
  imgs.forEach(function (u) { media.push({ t: 'i', src: u }); });
  function slideInner(m) {
    return m.t === 'v'
      ? SKY.videoHTML(m.src, imgs[0])
      : '<img src="' + E(m.src) + '" alt="' + E(p.name) + '">';
  }
  var specs = (p.specs || []).map(function (s) {
    return '<tr><td>' + E(s[0]) + '</td><td>' + E(s[1]) + '</td></tr>';
  }).join('');
  var wa = 'https://wa.me/' + SKY.WA + '?text=' + encodeURIComponent('Hi Buy EV Truck AU, I am interested in the ' + p.name + ' (' + SKY.money(p.price) + '). ' + location.href);
  var waIcon = '<svg viewBox="0 0 24 24" width="16" height="16" fill="#fff" style="margin-right:8px;vertical-align:-3px"><path d="M12 2a10 10 0 0 0-8.6 15.100L2 22l5-1.300A10 10 0 1 0 12 2zm0 18.200a8.200 8.200 0 0 1-4.200-1.200l-.3-.2-3 .8.8-2.900-.2-.3A8.200 8.200 0 1 1 12 20.200zm4.500-6.100c-.2-.1-1.500-.7-1.700-.8s-.4-.1-.6.100-.6.8-.8 1-.3.2-.6.1a6.700 6.700 0 0 1-3.300-2.900c-.2-.4.200-.4.700-1.300a.5.500 0 0 0 0-.5l-.8-1.900c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.300 3 3 0 0 0-.9 2.200 5.200 5.200 0 0 0 1.100 2.800 11.900 11.900 0 0 0 4.600 4.100c1.700.7 2.400.8 3.200.7a2.700 2.700 0 0 0 1.800-1.300 2.200 2.200 0 0 0 .2-1.300c-.1-.1-.3-.2-.6-.3z"/></svg>';

  view.innerHTML =
    '<div class="crumbs"><a href="index.html">Home</a> / <a href="products.html">Products</a> / ' + E(p.name) + '</div>' +
    '<div class="detail"><div>' +
      '<div class="gal-main slider" id="gmain"><div class="track" id="track">' + media.map(function (m, i) {
        // the video slide is only rendered while it is on screen (see the slider code below)
        return '<div class="slide' + (m.t === 'v' ? ' v' : '') + '" data-i="' + i + '">' + (m.t === 'v' ? (i === 0 ? slideInner(m) : '') : slideInner(m)) + '</div>';
      }).join('') + '</div>' +
      (media.length > 1 ? '<button type="button" class="arr prev" id="aprev" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button><button type="button" class="arr next" id="anext" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>' : '') +
      '</div>' +
      (media.length > 1 ? '<div class="thumbs" id="th">' + media.map(function (m, i) {
        return '<button type="button" class="' + (i ? '' : 'on') + (m.t === 'v' ? ' vthumb' : '') + '" data-i="' + i + '" aria-label="' + (m.t === 'v' ? 'Product video' : 'Image ' + (i + 1)) + '">' +
          (m.t === 'v' ? (imgs[0] ? '<img src="' + E(imgs[0]) + '" alt="">' : '') + '<span class="play"><i class="fa-solid fa-play"></i></span>' : '<img src="' + E(m.src) + '" alt="">') + '</button>';
      }).join('') + '</div>' : '') +
    '</div><div>' +
      '<h1>' + E(p.name) + '</h1>' +
      '<div class="d-price">' + SKY.money(p.price) + '</div>' +
      (p.priceNote ? '<div class="d-note">' + E(p.priceNote) + '</div>' : '') +
      (p.booking > 0 ? '<div class="book"><span>Booking price</span><b>' + SKY.money0(p.booking) + ' to Secure</b></div>' : '') +
      (p.description ? '<p class="d-desc">' + E(p.description) + '</p>' : '') +
      (specs ? '<h4>Features</h4><table class="specs">' + specs + '</table>' : '') +
      '<div class="actions"><a class="btn wa" href="' + wa + '" target="_blank" rel="noopener">' + waIcon + 'WhatsApp</a>' +
      '<a class="btn line" href="products.html">All Products</a></div>' +
    '</div></div>' +
    '<div class="related" id="rel"></div>';

  /* ---------- slider: auto-advances every 5 s, arrows, swipe, thumbnails ---------- */
  var th = document.getElementById('th'), track = document.getElementById('track'),
      gmain = document.getElementById('gmain'), slides = [].slice.call(track.children),
      cur = 0, timer = null, held = false, stopped = false, DELAY = 5000;

  function setVideoSlide(i, on) {            // render the video only while visible, so it stops when you leave it
    var m = media[i]; if (m.t !== 'v') return;
    slides[i].innerHTML = on ? slideInner(m) : '';
  }
  function go(n, manual) {
    if (media.length < 2) return;
    n = (n + media.length) % media.length;
    if (n === cur) return;
    setVideoSlide(cur, false);
    cur = n;
    setVideoSlide(cur, true);
    track.style.transform = 'translateX(-' + (cur * 100) + '%)';
    if (th) {
      [].forEach.call(th.children, function (c, k) { c.classList.toggle('on', k === cur); });
      var b = th.children[cur];                // keep the active thumbnail in view (horizontal scroll)
      th.scrollTo({ left: b.offsetLeft - (th.clientWidth - b.offsetWidth) / 2, behavior: 'smooth' });
    }
    if (manual) { stopped = false; restart(); }
  }
  function tick() { if (!held && !stopped && !document.hidden) go(cur + 1); }
  function restart() { clearInterval(timer); if (media.length > 1) timer = setInterval(tick, DELAY); }

  if (media.length > 1) {
    document.getElementById('aprev').onclick = function () { go(cur - 1, true); };
    document.getElementById('anext').onclick = function () { go(cur + 1, true); };
    th.onclick = function (e) { var b = e.target.closest('button'); if (b) go(+b.dataset.i, true); };

    // pause while the mouse is over the slider / a finger is on it
    gmain.addEventListener('mouseenter', function () { held = true; });
    gmain.addEventListener('mouseleave', function () { held = false; });

    // stop auto-advance once the visitor starts playing the video, so it is never cut off
    gmain.addEventListener('play', function () { stopped = true; }, true);
    window.addEventListener('blur', function () {            // click inside a YouTube/Vimeo iframe
      setTimeout(function () { if (document.activeElement && document.activeElement.tagName === 'IFRAME' && gmain.contains(document.activeElement)) stopped = true; }, 0);
    });

    // swipe on phones
    var x0 = null;
    gmain.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; held = true; }, { passive: true });
    gmain.addEventListener('touchend', function (e) {
      held = false;
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1), true);
    }, { passive: true });

    restart();
  }

  var others = SKY.newest(all.filter(function (x) { return x.id !== p.id; })).slice(0, 3);
  if (others.length) {
    document.getElementById('rel').innerHTML = '<h2>More <span class="ac">Products</span></h2><div class="grid">' + others.map(SKY.cardHTML).join('') + '</div>';
  }
  });
})();
</script>
</body>
</html>
